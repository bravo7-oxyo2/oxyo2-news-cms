server {
  listen 80;
  server_name CMS_ADMIN_DOMAIN;
  client_max_body_size 500m;

  root /home/ubuntu/apps/cms/apps/admin/dist;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /media/ {
    alias /home/ubuntu/apps/cms/shared/uploads/;
    expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }
  location /api/ { proxy_pass http://127.0.0.1:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 300s; proxy_send_timeout 300s; }
  location = /health { proxy_pass http://127.0.0.1:4000; }
  location = /ready { proxy_pass http://127.0.0.1:4000; }
  location /docs { proxy_pass http://127.0.0.1:4000; }
}

server {
  # Consolidates Google (and every other) indexing signal onto the apex host,
  # matching PUBLIC_BASE_URL and every canonical/sitemap/hreflang tag emitted
  # by the API. Without this, www and apex serve identical content with no
  # redirect, so crawlers split signal across two hosts arbitrarily.
  #
  # Primary protection is a Cloudflare Redirect Rule (hostname eq
  # www.NEWS_DOMAIN -> 301 https://NEWS_DOMAIN + path, query preserved), which
  # answers at the edge before the request reaches this box. This block is the
  # origin-side fallback. The live server also carries a matching `listen 443
  # ssl` block for www.NEWS_DOMAIN (certbot-managed cert paths) with the same
  # `return 301`, so a direct HTTPS hit on www is redirected too, not only
  # port 80. Keep both in sync when the domain changes.
  listen 80;
  server_name www.NEWS_DOMAIN;
  return 301 https://NEWS_DOMAIN$request_uri;
}

server {
  listen 80;
  server_name NEWS_DOMAIN;
  client_max_body_size 500m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  root /home/ubuntu/apps/cms/apps/news/dist;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; font-src 'self' data:; media-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;

  # Reader page routes are server-rendered by the API so crawlers receive full
  # HTML; the SPA assets in the response hydrate the page in browsers.
  location = / { proxy_pass http://127.0.0.1:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /article/ { proxy_pass http://127.0.0.1:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /category/ { proxy_pass http://127.0.0.1:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /page/ { proxy_pass http://127.0.0.1:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /search { proxy_pass http://127.0.0.1:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; font-src 'self' data:; media-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    try_files /index.html =404;
  }
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; font-src 'self' data:; media-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    # Serve any real static file as before; only genuinely unmatched paths
    # (not a known SPA route, not a file in dist/) fall through to the API,
    # which returns a real 404 instead of a soft-200 SPA shell.
    try_files $uri $uri/ @unmatched;
  }
  location @unmatched {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; font-src 'self' data:; media-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    try_files $uri =404;
  }
  location = /favicon.svg {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location = /site.webmanifest {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location /media/ {
    alias /home/ubuntu/apps/cms/shared/uploads/;
    expires 1y; add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri =404;
  }
  # Provider images are delivered as first-party assets so their third-party
  # cookies never reach readers' browsers.
  location /images/unsplash/ {
    # Resolve at request time so a DNS hiccup cannot make nginx fail to start.
    resolver 169.254.169.253 127.0.0.53 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $ups_unsplash images.unsplash.com;
    rewrite ^/images/unsplash/(.*)$ /$1 break;
    proxy_pass https://$ups_unsplash;
    proxy_ssl_server_name on;
    proxy_set_header Host images.unsplash.com;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location /images/pexels/ {
    # Resolve at request time so a DNS hiccup cannot make nginx fail to start.
    resolver 169.254.169.253 127.0.0.53 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $ups_pexels images.pexels.com;
    rewrite ^/images/pexels/(.*)$ /$1 break;
    proxy_pass https://$ups_pexels;
    proxy_ssl_server_name on;
    proxy_set_header Host images.pexels.com;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location /images/pixabay/ {
    # Resolve at request time so a DNS hiccup cannot make nginx fail to start.
    resolver 169.254.169.253 127.0.0.53 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $ups_pixabay cdn.pixabay.com;
    rewrite ^/images/pixabay/(.*)$ /$1 break;
    proxy_pass https://$ups_pixabay;
    proxy_ssl_server_name on;
    proxy_set_header Host cdn.pixabay.com;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location = /sitemap.xml { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /news-sitemap.xml { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /rss.xml { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /robots.txt {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cloudflare may append managed crawl directives at the edge. Do not
    # forward the origin byte count, which would make the combined response
    # unreadable to strict crawlers such as Lighthouse.
    proxy_hide_header Content-Length;
    proxy_http_version 1.1;
    proxy_buffering off;
  }
  location = /llms.txt {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    expires 5m;
  }
  location /api/ { proxy_pass http://127.0.0.1:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 300s; proxy_send_timeout 300s; }
}
